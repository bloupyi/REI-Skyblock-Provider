name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon build compileGametestJava
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          release_notes="docs/releases/${release_version}.md"
          mod_jar="build/libs/rei-skyblock-provider-${release_version}+mc26.2.jar"
          source_jar="build/libs/rei-skyblock-provider-${release_version}+mc26.2-sources.jar"
          project_zip="build/distributions/rei-skyblock-provider-${release_version}+mc26.2-project.zip"
          test -f "$release_notes"
          test -f "$mod_jar"
          test -f "$source_jar"
          test -f "$project_zip"
          gh release create "$GITHUB_REF_NAME" "$mod_jar" "$source_jar" "$project_zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "REI Skyblock Provider ${release_version} (Minecraft 26.2)" \
            --notes-file "$release_notes" \
            --latest
